    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.85)),
                        url('https://picsum.photos/800/1200') no-repeat center center/cover;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Main Card Styling */
        .card {
            background: linear-gradient(180deg, #0d3815 0%, #051a09 100%);
            border: 1.5px solid #1f6b2e;
            border-radius: 22px;
            padding: 24px 18px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
        }

        /* Profile Image */
        .profile-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 14px;
            border-radius: 50%;
            padding: 3.5px;
            background: linear-gradient(135deg, #ffd700, #ff9900, #00ff66);
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.45);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        /* Brand Headings */
        .brand-name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #d1d5db;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .active-members {
            color: #ffcc00;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 18px;
            display: inline-block;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        .stat-box {
            border: 1px solid #236330;
            border-radius: 12px;
            padding: 10px 4px;
            background: rgba(0, 0, 0, 0.35);
        }

        .stat-value {
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
        }

        .stat-label {
            color: #9ca3af;
            font-size: 11px;
            margin-top: 3px;
        }

        /* Trust Features */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .feature-icon {
            color: #00ff66;
            font-size: 18px;
        }

        .feature-text {
            color: #d1fae5;
            font-size: 11px;
            font-weight: 500;
        }

        /* Golden Glow & Blinking Join Button */
        .btn-join {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 16px;
            padding: 15px 12px;
            background: linear-gradient(180deg, #7cfc00 0%, #32cd32 100%);
            color: #990000;
            font-size: 17px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 14px;
            transition: transform 0.15s ease-in-out;
            animation: goldenGlowBlink 1.4s infinite ease-in-out;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-join:active {
            transform: scale(0.97);
        }

        @keyframes goldenGlowBlink {
            0% {
                box-shadow: 0 0 10px #ffd700, 0 0 20px rgba(255, 215, 0, 0.6);
                opacity: 1;
            }
            50% {
                box-shadow: 0 0 22px #ffd700, 0 0 35px #ffae00, 0 0 45px rgba(255, 215, 0, 0.8);
                opacity: 0.92;
                transform: scale(1.015);
            }
            100% {
                box-shadow: 0 0 10px #ffd700, 0 0 20px rgba(255, 215, 0, 0.6);
                opacity: 1;
            }
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            line-height: 1.5;
            width: 100%;
        }

        /* Stylish Ads Setup Badge */
        .ads-setup-box {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px dashed #2d703a;
            padding: 6px 14px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
        }

        .ads-text {
            color: #9ca3af;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .ads-author {
            color: #ffd700;
            font-weight: 700;
            font-size: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .ads-author:hover {
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
        }
    </style>
</head>
